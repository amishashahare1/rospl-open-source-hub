
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROSPL Contribution Tracker</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">ROSPL Open Source Hub</a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="text-center mb-4">
            <h1>Contribution Tracker</h1>
            <p class="text-secondary">
                Track your open-source contributions in one place.
            </p>
        </div>

        <div class="card shadow-sm mx-auto tracker-card">
            <div class="card-body p-4">
                <form id="contributionForm">
                    <label for="contribution" class="form-label">
                        Contribution Details
                    </label>

                    <input
                        type="text"
                        id="contribution"
                        class="form-control mb-3"
                        placeholder="e.g. Fixed a bug in HTML"
                        required
                    >

                    <button type="submit" class="btn btn-primary w-100">
                        Add Contribution
                    </button>
                </form>

                <hr>

                <h5>Recorded Contributions</h5>
                <p id="emptyMessage" class="text-secondary">
                    No contributions yet.
                </p>

                <ul id="contributionList" class="list-group"></ul>

                <p class="mt-3 mb-0">
                    Total contributions:
                    <strong id="totalCount">0</strong>
                </p>
            </div>
        </div>
    </main>

    <footer class="text-center text-secondary py-3">
        ROSPL ITL704 | Open Source Contribution Project
    </footer>

    <script src="../typescript/app.js"></script>
</body>
</html>
